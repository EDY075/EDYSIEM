name: CI

on:
  push:
    branches: [master, security/hardening-0.3.0]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,api]"
      - run: python -m pytest
      - run: python -m mypy
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Build and smoke-test wheel
        run: |
          python -m pip install build==1.3.0
          python -m build
          python -m venv .wheel-smoke
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel_path"
          .wheel-smoke/bin/python -m pip install "${wheel_path}[api]"
          .wheel-smoke/bin/python -m pip check
          .wheel-smoke/bin/edysiem version
          .wheel-smoke/bin/python - <<'PY'
          import asyncio
          import os

          from fastapi import HTTPException
          from starlette.requests import Request

          from edysiem.api.app import create_app
          from edysiem.api.security import require_api_key
          from edysiem.exceptions import ConfigurationException


          def request(path: str, api_key: str | None = None) -> Request:
              headers = [] if api_key is None else [(b"x-api-key", api_key.encode("utf-8"))]
              return Request(
                  {
                      "type": "http",
                      "asgi": {"version": "3.0"},
                      "http_version": "1.1",
                      "method": "GET",
                      "scheme": "http",
                      "path": path,
                      "raw_path": path.encode("ascii"),
                      "query_string": b"",
                      "headers": headers,
                      "client": ("127.0.0.1", 47000),
                      "server": ("127.0.0.1", 8080),
                  }
              )


          async def expect_rejected(expected_status: int, api_key: str | None = None) -> None:
              try:
                  await require_api_key(request("/api/v1/auth/me", api_key))
              except HTTPException as exc:
                  assert exc.status_code == expected_status, exc
              else:
                  raise AssertionError(f"protected request unexpectedly accepted; expected {expected_status}")


          auth_names = (
              "EDYSIEM_API_KEY",
              "EDYSIEM_API_IDENTITY",
              "EDYSIEM_API_ROLE",
              "EDYSIEM_SHIELD_INGEST_TOKEN",
              "EDYSIEM_SHIELD_INGEST_PREVIOUS_TOKEN",
          )
          for name in auth_names:
              os.environ.pop(name, None)

          app = create_app()
          assert any(route.path == "/api/v1/auth/me" for route in app.routes)
          asyncio.run(expect_rejected(503))

          shared_secret = "ci-shared-secret-must-be-rejected-000000000000"
          os.environ.update(
              {
                  "EDYSIEM_API_KEY": shared_secret,
                  "EDYSIEM_API_IDENTITY": "ci.operator",
                  "EDYSIEM_API_ROLE": "admin",
                  "EDYSIEM_SHIELD_INGEST_TOKEN": shared_secret,
              }
          )
          try:
              create_app()
          except ConfigurationException as exc:
              assert str(exc) == "credential configuration is invalid"
              assert shared_secret not in str(exc)
          else:
              raise AssertionError("operator/Shield credential collision was not rejected")
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:security
      - name: Build frontend without bundling an authentication sentinel
        env:
          VITE_API_KEY_SENTINEL: edysiem-ci-secret-must-never-enter-dist-9382
        run: npm run build
      - name: Verify authentication material is absent from the bundle
        env:
          VITE_API_KEY_SENTINEL: edysiem-ci-secret-must-never-enter-dist-9382
        run: npm run test:bundle-security
      - name: Frontend runtime smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --strictPort &
          preview_pid=$!
          trap 'kill $preview_pid' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
